<form #formFiltres="ngForm"  (ngSubmit)="aplica()">

  <label for="text">Cerca per títol</label>
  <input
    id="text"
    name="text"
    type="text"
    required minlength="3"
    #textCtrl="ngModel"
    [(ngModel)]="text">


  @if (textCtrl.invalid && textCtrl.touched) {
    <p class="error">
      Escriu 3 caràcters com a mínim.
    </p>
  }

  
  
  <label for="categoria">Categoria</label>
  <select
    id="categoria"
    name="categoria"
    [(ngModel)]="categoria">

    <option value="">Totes</option>

    @for (cat of categories; track cat) {
      <option [value]="cat">{{ cat }}</option>
    }
  </select>

  <button type="submit" [disabled]="formFiltres.invalid">Aplica</button>

  <button type="button" (click)="restableix()">
    Restableix
  </button>

</form>
